<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Task Manager</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <header class="header">
            <div>
                <h1>My Tasks 📚</h1>
                <p>Manage your student activities.</p>
            </div>
            <span class="logo">STM</span>
        </header>

        <!-- Add Task -->
        <form id="taskForm" class="task-form">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter a new task..."
                maxlength="100"
                required
            >

            <button type="submit" class="add-btn">
                + Add Task
            </button>

        </form>

        <!-- Statistics -->
        <div class="stats">

            <div class="stat-card">
                <span>Total Tasks</span>
                <h2 id="total">0</h2>
            </div>

            <div class="stat-card">
                <span>Completed</span>
                <h2 id="completedCount">0</h2>
            </div>

            <div class="stat-card">
                <span>Pending</span>
                <h2 id="pending">0</h2>
            </div>

        </div>

        <!-- Search and Filter -->
        <div class="toolbar">

            <input
                type="text"
                id="searchInput"
                placeholder="Search tasks..."
            >

            <select id="filterSelect">
                <option value="all">All Tasks</option>
                <option value="completed">Completed</option>
                <option value="pending">Pending</option>
            </select>

        </div>

        <!-- Task List -->
        <div class="task-section">

            <div class="section-header">
                <h2>My Task List</h2>

                <button id="clearAllBtn" class="clear-btn">
                    Clear All
                </button>
            </div>

            <div id="taskList"></div>

        </div>

        <footer>
            <p>Student Task Manager © 2026</p>
        </footer>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
